<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102D27" />
      <stop offset="60%" stop-color="#173F35" />
      <stop offset="100%" stop-color="#235A4D" />
    </linearGradient>
    <linearGradient id="goldSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEC48F" />
      <stop offset="100%" stop-color="#C5A66B" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  <!-- Sun / Horizon glow -->
  <circle cx="400" cy="220" r="70" fill="url(#goldSun)" opacity="0.3"/>
  <circle cx="400" cy="220" r="45" fill="url(#goldSun)" opacity="0.8"/>
  <!-- Mountain Ranges -->
  <path d="M0 500 L120 340 L260 440 L400 250 L560 410 L680 320 L800 500 Z" fill="#102D27" opacity="0.7"/>
  <path d="M0 500 L180 360 L320 460 L480 300 L620 420 L750 350 L800 500 Z" fill="#173F35"/>
  <!-- Text Label -->
  <text x="400" y="440" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="#F8F5EF" text-anchor="middle" letter-spacing="3">THE MEMORABLE TRIP</text>
  <text x="400" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#C5A66B" text-anchor="middle" letter-spacing="4">NORTHEAST INDIA JOURNEYS</text>
</svg>
